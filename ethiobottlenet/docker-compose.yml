version: '3.8'

services:
  db:
    image: postgres:16
    container_name: ethiobottlenet_db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    ports:
      - "5435:5432"
    restart: unless-stopped

  odoo:
    image: odoo:18.0
    container_name: ethiobottlenet_odoo
    depends_on:
      - db
    ports:
      - "8019:8069"
      - "8073:8072"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo
      - odoo-web-data:/var/lib/odoo
    restart: unless-stopped

volumes:
  odoo-web-data:
  odoo-db-data: