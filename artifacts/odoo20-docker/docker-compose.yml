# Odoo 20 + PostgreSQL 16

services:
  db:
    image: postgres:16
    container_name: odoo20-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - odoo20-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:20.0
    container_name: odoo20
    depends_on:
      - db
    ports:
      - "8089:8069"          # Change to "8070:8069" if 8069 is used by Odoo 18
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo20-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    restart: unless-stopped

volumes:
  odoo20-db-data:
  odoo20-web-data: